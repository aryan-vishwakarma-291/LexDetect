<!DOCTYPE html>
<html>
<head> 
<title>Legal Document Detector</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#eef2f3,#dfe9f3);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:white;
    width:600px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#2c3e50;
    margin-bottom:20px;
}

textarea{
    width:100%;
    padding:12px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
    resize:none;
}

.file-upload{
    margin-top:15px;
    padding:10px;
    border:2px dashed #aaa;
    border-radius:6px;
    background:#f9f9f9;
}

input[type="file"]{
    margin-top:8px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:16px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
  background:#43a047;
}

.result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<div class="container">

<h1>AI Legal Document Detection</h1>

<form method="POST" enctype="multipart/form-data">

<textarea name="document_text" rows="8"
placeholder="Paste your document text here..."></textarea>

<div class="file-upload">
<p>OR Upload File</p>
<input type="file" name="file">
</div>

<button type="submit">Analyze Document</button>

</form>

{% if result %}
<div class="result">
Prediction: {{ result }}
</div>
<div class="result-box">
    <h3>{{ result }}</h3>

    {% if confidence %}
    <p><strong>Confidence:</strong> {{ confidence }}%</p>
    {% endif %}
</div>
{% endif %}

</div>


</body>
</html>
