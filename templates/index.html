
<!DOCTYPE html>
<html lang="en">

<head>
    <title>AI Legal Document Detector</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#eef2f3,#dfe9f3);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial, sans-serif;
        }

        .main-card{
            width:650px;
            border-radius:20px;
            padding:35px;
            background:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.15);
        }

        .title{
            color:#2c3e50;
            font-weight:700;
        }

        .upload-box{
            border:2px dashed #6c757d;
            border-radius:15px;
            padding:20px;
            background:#f8f9fa;
        }

        .result-card{
            margin-top:25px;
            padding:20px;
            border-radius:15px;
            background:#f8fff8;
            border-left:6px solid #198754;
        }

        .prediction{
            font-size:24px;
            font-weight:bold;
            color:#198754;
        }

        .confidence{
            font-size:18px;
        }

        #drop-area{
            cursor:pointer;
            transition:0.3s;
        }

        #drop-area:hover{
            background:#eef7ff;
        }

        .drag-active{
            background:#dff6ff;
            border-color:#0d6efd;
        }

    </style>

</head>


<body>


<div class="main-card">

    <h1 class="text-center title mb-4">
        🤖 AI Legal Document Detector
    </h1>


    <form method="POST" enctype="multipart/form-data">


        <div class="mb-3">

            <label class="form-label fw-bold">
                Enter Document Text
            </label>

            <textarea 
            class="form-control"
            name="document_text"
            rows="8"
            placeholder="Paste your document text here..."></textarea>

        </div>



<div class="upload-box text-center" id="drop-area">

    <h5>📂 Drag & Drop Document</h5>

    <p class="text-muted">
        or click to select file
    </p>

    <input 
    type="file"
    id="fileInput"
    name="file"
    hidden>

    <button 
    type="button"
    class="btn btn-outline-primary"
    onclick="document.getElementById('fileInput').click()">
        Choose File
    </button>

    <p id="fileName" class="mt-3 text-success"></p>

</div>



        <button class="btn btn-success w-100 mt-4 py-2">
            🔍 Analyze Document
        </button>


    </form>




    {% if result %}

    <div class="result-card">


        <h4>
            📄 Prediction Result
        </h4>


        <hr>


        <div class="prediction">

            {% if result == "Legal Document" %}
                ✅ {{ result }}
            {% else %}
                ❌ {{ result }}
            {% endif %}

        </div>



        {% if confidence %}

        <div class="confidence mt-3">

            📊 
            <strong>Confidence:</strong>
            {{ confidence }}%

        </div>


        <div class="progress mt-2">

           <div 
                class="progress-bar bg-success"
                role="progressbar"
                aria-valuenow="{{ confidence }}"
                aria-valuemin="0"
                aria-valuemax="100"
                style="width:  {{ confidence }}%">
                    
                {{ confidence }}%

            </div>

        </div>

        {% endif %}


    </div>


    {% endif %}



</div>
<script>

const form = document.querySelector("form");
const button = document.querySelector("button");

form.addEventListener("submit", function(){

    button.innerHTML = "⏳ Analyzing Document...";
    button.disabled = true;

});

</script>
<script>

const dropArea = document.getElementById("drop-area");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");


dropArea.addEventListener("click",()=>{
    fileInput.click();
});


fileInput.addEventListener("change",()=>{
    showFile(fileInput.files[0]);
});


dropArea.addEventListener("dragover",(e)=>{
    e.preventDefault();
    dropArea.classList.add("drag-active");
});


dropArea.addEventListener("dragleave",()=>{
    dropArea.classList.remove("drag-active");
});


dropArea.addEventListener("drop",(e)=>{

    e.preventDefault();

    dropArea.classList.remove("drag-active");

    fileInput.files = e.dataTransfer.files;

    showFile(fileInput.files[0]);

});


function showFile(file){

    if(file){
        fileName.innerHTML = "Selected: 📄 " + file.name;
    }

}

</script>

</body>

</html>
